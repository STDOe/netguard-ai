name: Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Lint, types and tests
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check app migrations ../tests
          uv run --locked ruff format --check app migrations ../tests
          uv run --locked ruff check ../deploy
          uv run --locked ruff format --check ../deploy
          uv run --locked mypy
          uv run --locked pytest
      - name: Audit locked runtime dependencies
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/netguard-requirements.txt"
          uvx --from pip-audit==2.10.0 pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/netguard-requirements.txt"
      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git --redact
      - name: Compose startup, seeded topology and checkpoint
        shell: bash
        run: |
          NETGUARD_VIEWER_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          NETGUARD_ADMIN_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export NETGUARD_VIEWER_TOKEN NETGUARD_ADMIN_TOKEN
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --wait --wait-timeout 60
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/ |
            grep -F 'Access token'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NETGUARD_VIEWER_TOKEN}" \
            http://127.0.0.1:8000/api/v1/networks |
            python -c 'import json,sys; assert json.load(sys.stdin)[0]["name"] == "retail-payment-hub-spoke"'
          task_id="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${NETGUARD_VIEWER_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"kind":"greenfield","idempotency_key":"ci-interview","requirements":{}}' \
              http://127.0.0.1:8000/api/v1/tasks |
              python -c 'import json,sys; result=json.load(sys.stdin); assert result["status"]=="awaiting_input"; print(result["id"])'
          )"
          docker compose restart netguard-app
          docker compose up --no-build --wait --wait-timeout 60
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NETGUARD_VIEWER_TOKEN}" \
            "http://127.0.0.1:8000/api/v1/tasks/${task_id}" |
            python -c 'import json,sys; assert json.load(sys.stdin)["status"]=="awaiting_input"'
          docker compose exec -T netguard-app python - --disabled < deploy/workforce/client.py
          NETGUARD_WORKFORCE_TOKEN="$(python -c 'import secrets; print("ngw." + secrets.token_urlsafe(32))')"
          export NETGUARD_WORKFORCE_TOKEN
          NETGUARD_INTEGRATION_TOKEN_SHA256="$(python -c 'import hashlib, os; print(hashlib.sha256(os.environ["NETGUARD_WORKFORCE_TOKEN"].encode()).hexdigest())')"
          NETGUARD_INTEGRATION_EXPIRES_AT="$(python -c 'from datetime import UTC, datetime, timedelta; print((datetime.now(UTC) + timedelta(hours=1)).isoformat())')"
          NETGUARD_INTEGRATION_SCOPES="$(python -c 'import json,sys; print(json.dumps(["integration:" + item for item in sys.argv[1:]]))' \
            capabilities:read tasks:create tasks:read tasks:cancel events:read artifacts:read approvals:read)"
          NETGUARD_INTEGRATION_ENABLED=true
          export NETGUARD_INTEGRATION_ENABLED NETGUARD_INTEGRATION_TOKEN_SHA256 NETGUARD_INTEGRATION_EXPIRES_AT NETGUARD_INTEGRATION_SCOPES
          docker compose up --no-build --wait --wait-timeout 60
          docker compose exec -T -e NETGUARD_WORKFORCE_TOKEN netguard-app python - < deploy/workforce/client.py

      - name: Linux installer lifecycle and SQLite persistence
        run: bash tests/installer/smoke.sh

  installer-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      INSTALLER_POWERSHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - id: installer-tests
        run: python -m pytest -q -s --confcutdir=tests/installer tests/installer
      - name: Configuration error ${{ steps.installer-tests.outputs.config_stage }} ${{ steps.installer-tests.outputs.config_error }}
        if: failure() && steps.installer-tests.outputs.config_stage != ''
        run: exit 1
