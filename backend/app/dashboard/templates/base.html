<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
  {% if csrf %}<meta name="csrf-token" content="{{ csrf }}">{% endif %}
  <title>{{ title }} · NetGuard AI</title>
  <link rel="stylesheet" href="/static/tailwind.css">
  <!-- The pinned Cytoscape renderer recognizes this ID and skips injecting a style tag. -->
  <link id="__________cytoscape_stylesheet" rel="stylesheet" href="/static/dashboard.css">
  {% block scripts %}{% endblock %}
</head>
<body>{% block body %}{% endblock %}</body>
</html>
