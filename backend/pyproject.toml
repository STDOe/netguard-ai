[project]
name = "netguard-ai"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1.6,<4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "litellm>=1.82,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2.8,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "jsonschema>=4,<5",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "types-pyyaml>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "migrations", "../tests"]
